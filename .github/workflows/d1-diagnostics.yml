name: D1 Diagnostics

on:
  workflow_dispatch:
    inputs:
      window:
        description: Query Insights time window
        required: true
        default: 1h
        type: choice
        options:
          - 1h
          - 6h
          - 24h

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Resolve Cloudflare Account ID
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [[ -z "$ACCOUNT_ID" ]]; then
            ACCOUNT_ID="$(
              curl -fsSL "https://api.cloudflare.com/client/v4/accounts" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
              | jq -r '.result[0].id'
            )"
          fi
          test -n "$ACCOUNT_ID"
          test "$ACCOUNT_ID" != "null"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
      - name: Resolve D1 database
        shell: bash
        run: |
          set -euo pipefail
          D1_ID="$(
            pnpm --filter @uptimer/worker exec wrangler d1 list --json \
            | jq -r 'map(select(.name == "uptimer")) | .[0].uuid // .[0].id // empty'
          )"
          test -n "$D1_ID"
          cat > /tmp/wrangler-d1-diagnostics.toml <<EOF
          name = "uptimer-d1-diagnostics"
          compatibility_date = "2026-01-28"
          [[d1_databases]]
          binding = "DB"
          database_name = "uptimer"
          database_id = "$D1_ID"
          EOF
      - name: Runtime state
        shell: bash
        run: |
          set -euo pipefail
          echo '=== MONITORS ==='
          pnpm --filter @uptimer/worker exec wrangler d1 execute uptimer --remote --config /tmp/wrangler-d1-diagnostics.toml \
            --command "SELECT id, name, interval_sec, is_active FROM monitors ORDER BY id;" --json
          echo '=== FRAGMENT LAST WRITE ==='
          pnpm --filter @uptimer/worker exec wrangler d1 execute uptimer --remote --config /tmp/wrangler-d1-diagnostics.toml \
            --command "SELECT COUNT(*) AS fragment_count, MAX(updated_at) AS max_updated_at, datetime(MAX(updated_at), 'unixepoch') AS max_updated_utc FROM public_snapshot_fragments;" --json
          echo '=== SNAPSHOT FRESHNESS ==='
          pnpm --filter @uptimer/worker exec wrangler d1 execute uptimer --remote --config /tmp/wrangler-d1-diagnostics.toml \
            --command "SELECT key, generated_at, datetime(generated_at, 'unixepoch') AS generated_utc, CAST(strftime('%s','now') AS INTEGER) - generated_at AS age_sec, updated_at, datetime(updated_at, 'unixepoch') AS updated_utc FROM public_snapshots ORDER BY key;" --json
          echo '=== MONITOR STATE ==='
          pnpm --filter @uptimer/worker exec wrangler d1 execute uptimer --remote --config /tmp/wrangler-d1-diagnostics.toml \
            --command "SELECT COUNT(*) AS monitor_states, MIN(last_checked_at) AS oldest_last_checked_at, MAX(last_checked_at) AS newest_last_checked_at, datetime(MIN(last_checked_at), 'unixepoch') AS oldest_checked_utc, datetime(MAX(last_checked_at), 'unixepoch') AS newest_checked_utc FROM monitor_state;" --json
      - name: Globalping persistence
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.window }}" in
            1h) WINDOW_SECONDS=3600 ;;
            6h) WINDOW_SECONDS=21600 ;;
            24h) WINDOW_SECONDS=86400 ;;
            *) echo "Unsupported window: ${{ inputs.window }}" >&2; exit 1 ;;
          esac
          CUTOFF_EXPR="CAST(strftime('%s','now') AS INTEGER) - ${WINDOW_SECONDS}"

          echo "=== GLOBALPING_PERSISTENCE_${{ inputs.window }} ==="
          pnpm --filter @uptimer/worker exec wrangler d1 execute uptimer --remote --config /tmp/wrangler-d1-diagnostics.toml \
            --command "SELECT m.id AS monitor_id, m.name, m.interval_sec, e.globalping_last_checked_at, datetime(e.globalping_last_checked_at, 'unixepoch') AS latest_checked_utc, e.globalping_history_last_written_at, datetime(e.globalping_history_last_written_at, 'unixepoch') AS history_last_written_utc, (SELECT COUNT(*) FROM check_results cr WHERE cr.monitor_id = m.id AND cr.checked_at >= ${CUTOFF_EXPR}) AS checks_in_window, (SELECT COUNT(*) FROM globalping_history gh WHERE gh.monitor_id = m.id AND gh.checked_at >= ${CUTOFF_EXPR}) AS history_rows_in_window, (SELECT MIN(gh.checked_at) FROM globalping_history gh WHERE gh.monitor_id = m.id AND gh.checked_at >= ${CUTOFF_EXPR}) AS first_history_at, datetime((SELECT MIN(gh.checked_at) FROM globalping_history gh WHERE gh.monitor_id = m.id AND gh.checked_at >= ${CUTOFF_EXPR}), 'unixepoch') AS first_history_utc, (SELECT MAX(gh.checked_at) FROM globalping_history gh WHERE gh.monitor_id = m.id AND gh.checked_at >= ${CUTOFF_EXPR}) AS last_history_at, datetime((SELECT MAX(gh.checked_at) FROM globalping_history gh WHERE gh.monitor_id = m.id AND gh.checked_at >= ${CUTOFF_EXPR}), 'unixepoch') AS last_history_utc FROM monitors m JOIN monitor_extensions e ON e.monitor_id = m.id WHERE m.is_active = 1 AND e.probe_mode = 'globalping' ORDER BY m.id;" --json

          echo "=== GLOBALPING_HISTORY_INTERVALS_${{ inputs.window }} ==="
          pnpm --filter @uptimer/worker exec wrangler d1 execute uptimer --remote --config /tmp/wrangler-d1-diagnostics.toml \
            --command "WITH history AS (SELECT gh.monitor_id, gh.checked_at, gh.checked_at - LAG(gh.checked_at) OVER (PARTITION BY gh.monitor_id ORDER BY gh.checked_at) AS gap_sec FROM globalping_history gh JOIN monitor_extensions e ON e.monitor_id = gh.monitor_id WHERE e.probe_mode = 'globalping' AND gh.checked_at >= ${CUTOFF_EXPR}), gaps AS (SELECT monitor_id, gap_sec FROM history WHERE gap_sec IS NOT NULL) SELECT m.id AS monitor_id, m.name, COUNT(g.gap_sec) AS interval_count, MIN(g.gap_sec) AS min_gap_sec, ROUND(AVG(g.gap_sec), 1) AS avg_gap_sec, MAX(g.gap_sec) AS max_gap_sec, SUM(CASE WHEN g.gap_sec < 900 THEN 1 ELSE 0 END) AS gaps_under_15m, SUM(CASE WHEN g.gap_sec >= 900 THEN 1 ELSE 0 END) AS gaps_at_or_over_15m FROM monitors m JOIN monitor_extensions e ON e.monitor_id = m.id LEFT JOIN gaps g ON g.monitor_id = m.id WHERE m.is_active = 1 AND e.probe_mode = 'globalping' GROUP BY m.id, m.name ORDER BY m.id;" --json

      - name: Top rows written
        run: |
          echo "=== WRITES_${{ inputs.window }} ==="
          pnpm --filter @uptimer/worker exec wrangler d1 insights uptimer \
            --config /tmp/wrangler-d1-diagnostics.toml \
            --time-period=${{ inputs.window }} \
            --sort-type=sum --sort-by=writes --sort-direction=DESC --limit=20 --json
      - name: Top rows read
        run: |
          echo "=== READS_${{ inputs.window }} ==="
          pnpm --filter @uptimer/worker exec wrangler d1 insights uptimer \
            --config /tmp/wrangler-d1-diagnostics.toml \
            --time-period=${{ inputs.window }} \
            --sort-type=sum --sort-by=reads --sort-direction=DESC --limit=20 --json
