name: P2 Scale Benchmark

on:
  push:
    branches:
      - 'perf/p2-scale-benchmark'
  pull_request:
    paths:
      - 'apps/worker/test/scheduled.bench.ts'
      - 'apps/worker/scripts/bench-scheduler.mjs'
      - '.github/workflows/p2-scale-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-scale-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scheduler-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run scheduler scale benchmark
        env:
          SCHEDULER_BENCH_RUNS: '8'
          SCHEDULER_BENCH_WARMUPS: '2'
          SCHEDULER_BENCH_WRITE_JSON: p2-scale-results.json
        run: pnpm --filter @uptimer/worker bench:scheduler | tee p2-scale-output.txt

      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo '### P2 scheduler scale benchmark'
            echo
            echo 'Scenarios: 10 / 25 / 50 monitors; staggered and burst; low-write / balanced / high-scale.'
            echo
            echo 'Local timing is a regression signal only and is not Cloudflare CPU billing data.'
            echo
            echo '\`\`\`text'
            cat p2-scale-output.txt 2>/dev/null || true
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-scale-benchmark
          path: |
            p2-scale-results.json
            p2-scale-output.txt
          if-no-files-found: warn
          retention-days: 14
