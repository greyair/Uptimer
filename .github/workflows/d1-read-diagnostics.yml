name: D1 Read Diagnostics

on:
  push:
    branches:
      - feature/extended-monitoring

permissions:
  contents: read

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Resolve Cloudflare Account ID
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [[ -z "$ACCOUNT_ID" ]]; then
            ACCOUNT_ID="$(
              curl -fsSL "https://api.cloudflare.com/client/v4/accounts" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
              | jq -r '.result[0].id'
            )"
          fi
          if [[ -z "$ACCOUNT_ID" || "$ACCOUNT_ID" == "null" ]]; then
            echo "Failed to resolve Cloudflare account id."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
      - name: Resolve D1 database config
        shell: bash
        run: |
          set -euo pipefail
          D1_ID="$(
            pnpm --filter @uptimer/worker exec wrangler d1 list --json             | jq -r 'map(select(.name == "uptimer")) | .[0].uuid // .[0].id // empty'
          )"
          if [[ -z "$D1_ID" || "$D1_ID" == "null" ]]; then
            echo "Failed to resolve D1 database id."
            exit 1
          fi
          cat > /tmp/wrangler-d1-insights.toml <<EOF
          name = "uptimer-d1-insights"
          compatibility_date = "2026-01-28"
          [[d1_databases]]
          binding = "DB"
          database_name = "uptimer"
          database_id = "$D1_ID"
          EOF
      - name: Top D1 queries by rows read
        run: |
          pnpm --filter @uptimer/worker exec wrangler d1 insights uptimer \
            --config /tmp/wrangler-d1-insights.toml \
            --time-period=1d \
            --sort-type=sum \
            --sort-by=reads \
            --sort-direction=DESC \
            --limit=15 \
            --json
