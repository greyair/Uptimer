name = "uptimer"
main = "src/index.ts"
compatibility_date = "2026-01-28"
compatibility_flags = ["nodejs_compat"]
minify = true

[observability]
enabled = true

  [observability.logs]
  invocation_logs = true
  head_sampling_rate = 1

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "uptimer"
# Replace with your real D1 database_id for remote/preview usage.
database_id = "00000000-0000-0000-0000-000000000000"

# Keep this table even if empty so `wrangler dev` loads secrets/vars from `.dev.vars`.
[vars]
ADMIN_RATE_LIMIT_MAX = "60"
ADMIN_RATE_LIMIT_WINDOW_SEC = "60"
UPTIMER_SCHEDULED_STATUS_REFRESH = "1"
UPTIMER_TRUST_SCHEDULED_RUNTIME_UPDATES = "1"

# Runtime profile. Individual UPTIMER_* vars still override profile defaults.
# low-write: Free Plan / small deployments; 5-minute public snapshot cadence.
# balanced: monolithic snapshots with 60-second cadence.
# high-scale: fragment/sharded pipeline with 60-second cadence.
UPTIMER_PROFILE = "low-write"
UPTIMER_PUBLIC_SNAPSHOT_FRESHNESS_SECONDS = "300"

# Advanced overrides. Leave the profile-owned feature flags unset unless you need
# to override one profile default explicitly.
UPTIMER_SHARDED_ASSEMBLER_MODE = "json"
UPTIMER_SHARDED_FRAGMENT_SEED_BATCH_SIZE = "4"
UPTIMER_SHARDED_RUNTIME_UPDATE_BATCH_SIZE = "5"
UPTIMER_INTERNAL_SCHEDULED_CHECK_BATCH_TIMEOUT_MS = "75000"
UPTIMER_INTERNAL_CHECK_BATCH_TRUST_SCHEDULER_LEASE = "1"
UPTIMER_SCHEDULED_REFRESH_LOGS = "0"
