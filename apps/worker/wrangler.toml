name = "uptimer"
main = "src/index.ts"
compatibility_date = "2026-01-28"
compatibility_flags = ["nodejs_compat"]
minify = true

[observability]
enabled = true

  [observability.logs]
  invocation_logs = true
  head_sampling_rate = 1

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "uptimer"
# Replace with your real D1 database_id for remote/preview usage.
database_id = "00000000-0000-0000-0000-000000000000"

# Keep this table even if empty so `wrangler dev` loads secrets/vars from `.dev.vars`.
[vars]
ADMIN_RATE_LIMIT_MAX = "60"
ADMIN_RATE_LIMIT_WINDOW_SEC = "60"
UPTIMER_SCHEDULED_STATUS_REFRESH = "1"
UPTIMER_TRUST_SCHEDULED_RUNTIME_UPDATES = "1"

# Low-write profile for small Cloudflare Free Plan deployments.
# Keep monitors on the normal aggregate snapshot path and avoid per-monitor
# fragment/continuation writes that multiply D1 rows_written.
UPTIMER_INTERNAL_SCHEDULED_BATCH_SIZE = "6"
UPTIMER_PUBLIC_MONITOR_UPDATE_FRAGMENT_WRITES = "0"
UPTIMER_SCHEDULED_RUNTIME_FRAGMENT_REFRESH = "0"
UPTIMER_PUBLIC_SHARDED_FRAGMENT_SEED = "0"
UPTIMER_SCHEDULED_SHARDED_FRAGMENT_SEED = "0"
UPTIMER_PUBLIC_SHARDED_ASSEMBLER = "0"
UPTIMER_SCHEDULED_SHARDED_ASSEMBLER = "0"
UPTIMER_PUBLIC_SHARDED_SNAPSHOT_PUBLISH = "0"
UPTIMER_SCHEDULED_SHARDED_PUBLISH = "0"
UPTIMER_PUBLIC_HOMEPAGE_ARTIFACT_FRAGMENT_WRITES = "0"
UPTIMER_SCHEDULED_SHARDED_SKIP_HOMEPAGE_REFRESH = "0"
UPTIMER_SCHEDULED_SHARDED_CONTINUATION = "0"
UPTIMER_INTERNAL_CHECK_BATCH_FRAGMENT_WRITE_SPLIT = "0"

# Retained high-scale tuning values; ignored while the fragment/sharded flags above are disabled.
UPTIMER_SHARDED_ASSEMBLER_MODE = "json"
UPTIMER_SHARDED_FRAGMENT_SEED_BATCH_SIZE = "4"
UPTIMER_SHARDED_RUNTIME_UPDATE_BATCH_SIZE = "5"
UPTIMER_INTERNAL_SCHEDULED_CHECK_BATCH_TIMEOUT_MS = "75000"
UPTIMER_INTERNAL_CHECK_BATCH_TRUST_SCHEDULER_LEASE = "1"
UPTIMER_SCHEDULED_REFRESH_LOGS = "0"
